services:
  eshopwebmvc:
    image: ${DOCKER_REGISTRY-}eshopwebmvc
    build:
      context: .
      dockerfile: src/Web/Dockerfile
    depends_on:
      - "sqlserver"
    environment:
      ConnectionStrings__CatalogConnection: "Server=sqlserver,1433;Initial Catalog=Microsoft.eShopOnWeb.CatalogDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};Trusted_Connection=false;TrustServerCertificate=true;"
      ConnectionStrings__IdentityConnection: "Server=sqlserver,1433;Initial Catalog=Microsoft.eShopOnWeb.Identity;User Id=sa;Password=${MSSQL_SA_PASSWORD};Trusted_Connection=false;TrustServerCertificate=true;"


  eshoppublicapi:
    image: ${DOCKER_REGISTRY-}eshoppublicapi
    build:
      context: .
      dockerfile: src/PublicApi/Dockerfile
    depends_on:
      - "sqlserver"
    environment:
      ConnectionStrings__CatalogConnection: "Server=sqlserver,1433;Initial Catalog=Microsoft.eShopOnWeb.CatalogDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};Trusted_Connection=false;TrustServerCertificate=true;"
      ConnectionStrings__IdentityConnection: "Server=sqlserver,1433;Initial Catalog=Microsoft.eShopOnWeb.Identity;User Id=sa;Password=${MSSQL_SA_PASSWORD};Trusted_Connection=false;TrustServerCertificate=true;"



  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "${SQLSERVER_HOST_PORT}:1433"
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      ACCEPT_EULA: "Y"
    volumes:
      - sqlserver-data:/var/opt/mssql


  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:?Set SEQ_ADMIN_PASSWORD in .env}
    ports:
      - "${SEQ_UI_HOST_PORT}:80"
      - "${SEQ_INGESTION_HOST_PORT}:5341"
    volumes:
      - seq-data:/data 


volumes:
  seq-data:
  sqlserver-data:

